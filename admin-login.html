<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In - Smart Reminder System</title><link rel="icon" href="images/logo.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="CSS/reference.css">
<link rel="stylesheet" href="CSS/portal-html.css"><script src="backend/js/student-session.js"></script><style>#emailVerification[hidden],main form[hidden],#googleSignIn[hidden]{display:none!important}</style></head><body class="auth-page login-page"><main class="auth-container"><div class="auth-box"><div class="auth-header"><h1>Smart Reminder System</h1><p>Sign in with your CampusSync account.</p></div><div class="error" id="staffLoginMessage" role="alert" aria-live="polite"></div><form id="staffLoginForm" data-allowed-roles="admin" data-cloud-only="true"><div class="form-group role-select-group"><label for="roleSelect">Sign In As:</label><select id="roleSelect" onchange="location.href=this.value"><option value="login.html" >Student</option><option value="tutor-login.html" >Tutor</option><option value="admin-login.html" selected>Admin</option><option value="super-admin-login.html" >Super Admin</option></select></div><div class="form-group"><label for="staffEmail">Email:</label><input type="email" id="staffEmail" required autocomplete="username" placeholder="Enter your email address"></div><div class="form-group"><label for="staffPassword">Password:</label><div class="password-wrapper"><input type="password" id="staffPassword" required autocomplete="current-password" placeholder="Enter your password"><button type="button" class="password-toggle" data-show-password="staffPassword" aria-label="Show password">Show</button></div></div><button id="forgotPassword" class="btn btn-outline btn-block" style="margin-bottom:12px" type="button">Forgot password?</button><p id="passwordResetMessage" role="status" aria-live="polite"></p><button class="btn btn-primary btn-block login-btn" type="submit">Sign In</button></form><section id="emailVerification" hidden class="section" style="margin-top:20px">
<h2>Verify your email</h2><p>Open the verification link in your inbox, then return here.</p>
<p id="verificationMessage" role="status"></p>
<button id="checkVerification" class="btn btn-primary btn-block" type="button">I have verified my email</button>
<button id="resendVerification" class="btn btn-outline btn-block" style="margin-top:10px" type="button">Resend verification email</button>
<button id="verificationSignOut" class="btn btn-outline btn-block" style="margin-top:10px" type="button">Use a different account</button>
</section><button id="googleSignIn" class="btn btn-outline btn-block" style="margin-top:12px" type="button">Continue with Google</button><p class="auth-switch">New to the system? <a href="register.html">Create an account</a></p><p class="auth-switch"><a href="index.html">Back to home</a></p><p class="portal-demo-note">Your CampusSync account opens the dashboard for your assigned role.</p></div></main><script src="backend/js/localData.js"></script>
<script src="backend/js/email-verification.js"></script>
<script src="backend/js/login.js"></script>
<script src="backend/js/theme.js"></script>
<script src="backend/js/portal-ui.js"></script></body></html>
